name: Build LynMusic Car APK (Lyrics XL)

# 触发：推送到 car-lyrics-3x 分支，或手动 workflow_dispatch
on:
  push:
    branches: [ car-lyrics-3x ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-car-apk:
    runs-on: ubuntu-latest
    steps:
      # 1) 克隆上游 v1.1.1 源码（标准 clone，稳定，绕开 fork 不含 tag 的问题）
      - name: Clone upstream v1.1.1 source
        run: |
          git clone --depth 1 https://github.com/wesley666/LynMusic.git src
          cd src
          git fetch --depth 1 origin refs/tags/v1.1.1:refs/tags/v1.1.1
          git checkout v1.1.1

      # 2) 从本 fork 分支(raw) 拉取歌词补丁并套用（2.5 倍，仅车机）
      - name: Download lyrics patch from fork & apply
        run: |
          curl -fsSL "https://raw.githubusercontent.com/tony8082/LynMusic/car-lyrics-3x/car-lyrics-3x.patch" -o src/car-lyrics-3x.patch
          cd src
          git apply car-lyrics-3x.patch

      # 3) 定制：独立包名(.xl) / 应用名(大字版) / 版本号 / 单 arm64
      - name: Customize package id, app name, version, abi
        run: |
          cd src
          # 版本号（readSharedVersionConfig 读此文件）
          sed -i 's/APP_VERSION_CODE = 111/APP_VERSION_CODE = 11101/' app-version.xcconfig
          sed -i 's/APP_VERSION_NAME = 1.1.1/APP_VERSION_NAME = 1.1.1-lyric-xl/' app-version.xcconfig
          # 包名 + namespace（独立 .xl，与原版互不冲突，可直接安装）
          sed -i 's/namespace = "top.iwesley.lyn.music.automotive"/namespace = "top.iwesley.lyn.music.automotive.xl"/' automotiveApp/build.gradle.kts
          sed -i 's/applicationId = "top.iwesley.lyn.music.automotive"/applicationId = "top.iwesley.lyn.music.automotive.xl"/' automotiveApp/build.gradle.kts
          sed -i 's/LynMusic-Car-$appVersionName/LynMusic-Car-XL-$appVersionName/' automotiveApp/build.gradle.kts
          # 仅 arm64-v8a，减小体积
          sed -i 's/include("arm64-v8a", "armeabi-v7a")/include("arm64-v8a")/' automotiveApp/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' automotiveApp/build.gradle.kts
          # 应用名（桌面显示，便于区分）
          sed -i 's/<string name="automotive_app_name">LynMusic<\/string>/<string name="automotive_app_name">LynMusic XL<\/string>/' automotiveApp/src/main/res/values/strings.xml
          sed -i 's/<string name="automotive_app_name">LynMusic 音乐<\/string>/<string name="automotive_app_name">LynMusic 大字版<\/string>/' automotiveApp/src/main/res/values-zh/strings.xml
          # 关闭 assemble 时的 lint 依赖，避免 Release 因 lint 规则失败
          echo "lyn.android.lintOnAssemble=false" > local.properties

      # 4) 生成 Release 签名 keystore（CI 内临时，仅用于本次构建）
      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore /home/runner/lynxl.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias lynxl \
            -storepass android -keypass android \
            -dname "CN=LynMusic XL, OU=Car, O=Lyn, C=CN"

      # 5) JDK 17（AGP 8.13 / Kotlin 2.3 需要）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 6) Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7) 安装 SDK 平台 + NDK（automotiveApp 需要 NDK 28.2.13676358）
      - name: Accept licenses & install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "ndk;28.2.13676358" || true

      - name: Make gradlew executable
        run: chmod +x src/gradlew

      # 8) 构建车机 Release APK（单 arm64-v8a，自签）
      - name: Build automotiveApp release APK (arm64-v8a only)
        run: |
          cd src
          ./gradlew :automotiveApp:assembleRelease --no-daemon --no-configuration-cache --stacktrace
        env:
          ANDROID_SIGNING_STORE_FILE: /home/runner/lynxl.jks
          ANDROID_SIGNING_STORE_PASSWORD: android
          ANDROID_SIGNING_KEY_ALIAS: lynxl
          ANDROID_SIGNING_KEY_PASSWORD: android
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      # 9) 上传 APK 产物
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LynMusic-Car-XL-release-arm64
          path: src/automotiveApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
