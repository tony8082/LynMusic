name: Build LynMusic Car APK (Lyrics XL)

# 触发：推送到 car-lyrics-3x 分支，或手动 workflow_dispatch
on:
  push:
    branches: [ car-lyrics-3x ]
  workflow_dispatch:

jobs:
  build-car-apk:
    runs-on: ubuntu-latest
    steps:
      # 1) 检出本 fork 分支（内含 car-lyrics-3x.patch 文件）
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) 从上游拉取 v1.1.1 标签，切到该标签，套用歌词放大 patch
      - name: Fetch v1.1.1 tag from upstream & apply lyrics patch
        run: |
          git remote add upstream https://github.com/wesley666/LynMusic.git
          git fetch upstream refs/tags/v1.1.1:refs/tags/v1.1.1 --depth=1
          git checkout v1.1.1
          git fetch origin car-lyrics-3x --depth=1
          git checkout origin/car-lyrics-3x -- car-lyrics-3x.patch
          git apply car-lyrics-3x.patch

      # 3) 修改应用名、版本号、包名（大字版专用）
      - name: Customize app name, version and package id
        run: |
          # 修改版本号
          sed -i 's/APP_VERSION_CODE = 111/APP_VERSION_CODE = 11101/' app-version.xcconfig
          sed -i 's/APP_VERSION_NAME = 1.1.1/APP_VERSION_NAME = 1.1.1-lyric-xl/' app-version.xcconfig
          
          # 修改包名和 namespace
          sed -i 's/namespace = "top.iwesley.lyn.music.automotive"/namespace = "top.iwesley.lyn.music.automotive.xl"/' automotiveApp/build.gradle.kts
          sed -i 's/applicationId = "top.iwesley.lyn.music.automotive"/applicationId = "top.iwesley.lyn.music.automotive.xl"/' automotiveApp/build.gradle.kts
          sed -i 's/LynMusic-Car-$appVersionName/LynMusic-Car-XL-$appVersionName/' automotiveApp/build.gradle.kts
          
          # 仅保留 arm64-v8a，减小 APK 体积
          sed -i 's/include("arm64-v8a", "armeabi-v7a")/include("arm64-v8a")/' automotiveApp/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' automotiveApp/build.gradle.kts
          
          # 修改应用名
          sed -i 's/LynMusic<\/string>/LynMusic XL<\/string>/' automotiveApp/src/main/res/values/strings.xml
          sed -i 's/LynMusic 音乐<\/string>/LynMusic 大字版<\/string>/' automotiveApp/src/main/res/values-zh/strings.xml

      # 4) JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 5) Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6) 安装 SDK 平台 + NDK
      - name: Accept licenses & install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "ndk;28.2.13676358" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 7) 构建车机 Debug APK（系统自动签名，可直接安装）
      - name: Build automotiveApp debug APK (arm64-v8a only)
        run: ./gradlew :automotiveApp:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      # 8) 上传 APK 产物
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LynMusic-Car-XL-debug-arm64
          path: automotiveApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
