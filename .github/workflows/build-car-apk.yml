name: Build LynMusic Car APK (2x + Clock)

# 触发：推送到 car-lyrics-2x-clock 分支，或手动 workflow_dispatch
on:
  push:
    branches: [ car-lyrics-2x-clock ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-car-apk:
    runs-on: ubuntu-latest
    steps:
      # 1) 克隆上游 v1.1.1 源码（公开仓库，标准 clone，稳定）
      - name: Clone upstream v1.1.1 source
        run: |
          git clone --depth 1 https://github.com/wesley666/LynMusic.git src
          cd src
          git fetch --depth 1 origin refs/tags/v1.1.1:refs/tags/v1.1.1
          git checkout v1.1.1
          git reset --hard v1.1.1
          git --no-pager log -1 --oneline

      # 2) 从本仓库取补丁（2x 歌词 + 大时钟 + 播放页字号 + 触发区重分配，仅车机）并应用
      - name: Fetch & apply lyrics+clock patch (car-only)
        run: |
          git clone --depth 1 -b car-lyrics-2x-clock https://github.com/tony8082/LynMusic.git fork
          cp fork/car-lyrics-2x-clock.patch /tmp/lyrics.patch
          cd src
          if grep -q "lyricsTextScale" player/app/src/commonMain/kotlin/top/iwesley/lyn/music/PlayerLyricsShareUi.kt; then
            echo "::error:: 源码已含 lyricsTextScale，说明没有落在干净的 v1.1.1 上，停止构建"
            exit 1
          fi
          git apply /tmp/lyrics.patch

      # 3) 定制：独立包名(.xl2c) / 应用名(大字版) / 版本号 / 关 lint
      #    ⚠️ 只改 applicationId（与原版共存靠它），严禁改 namespace！
      - name: Customize application id, app name, version
        run: |
          cd src
          sed -i 's/APP_VERSION_CODE = 111/APP_VERSION_CODE = 11111/' app-version.xcconfig
          sed -i 's/APP_VERSION_NAME = 1.1.1/APP_VERSION_NAME = 1.1.1-lyric-2x-clock-v7/' app-version.xcconfig
          sed -i 's/applicationId = "top.iwesley.lyn.music.automotive"/applicationId = "top.iwesley.lyn.music.automotive.xl2c"/' automotiveApp/build.gradle.kts
          sed -i 's/LynMusic-Car-$appVersionName/LynMusic-Car-XL2C-$appVersionName/' automotiveApp/build.gradle.kts
          # ⚠️ 应用名须覆盖全部语言目录，否则车机精确匹配 zh-rCN 仍显示原版名
          sed -i 's/<string name="automotive_app_name">LynMusic<\/string>/<string name="automotive_app_name">LynMusic 大字版<\/string>/' automotiveApp/src/main/res/values/strings.xml
          sed -i 's/<string name="automotive_app_name">LynMusic 音乐<\/string>/<string name="automotive_app_name">LynMusic 大字版<\/string>/' automotiveApp/src/main/res/values-zh/strings.xml
          sed -i 's/<string name="automotive_app_name">LynMusic 音乐<\/string>/<string name="automotive_app_name">LynMusic 大字版<\/string>/' automotiveApp/src/main/res/values-zh-rCN/strings.xml
          echo "lyn.android.lintOnAssemble=false" > local.properties

      # 4) 从仓库 Secrets 读取固定签名 keystore（v6 起不再把密钥明文放在公开仓库）
      #    签名固定 → v4 之后各版本可互相覆盖安装，无需卸载
      #    ⚠️ 首次启用前需在 Settings > Secrets and variables > Actions 添加
      #       SIGNING_KEYSTORE_BASE64（内容 = lynxl2c.jks 的 base64 单行文本）
      - name: Decode fixed signing keystore from secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error:: 未配置 SIGNING_KEYSTORE_BASE64，无法签名，停止构建"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /home/runner/lynxl.jks
          keytool -list -v -keystore /home/runner/lynxl.jks -storepass android 2>/dev/null | grep -E "Alias name|SHA256:" | head -3

      # 5) JDK 21（AGP 8.13 / Kotlin 2.3，jvmTarget=21，与上游一致）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 6) Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7) 安装 SDK 平台 + NDK（automotiveApp 需要 NDK 28.2.13676358）
      - name: Accept licenses & install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "ndk;28.2.13676358" || true

      - name: Make gradlew executable
        run: chmod +x src/gradlew

      # 8) 构建车机 Release APK (universal)
      #    保留上游 ABI 配置（arm64-v8a + armeabi-v7a + universal），
      #    兼容 32 位车机固件；上游官方 Car APK 也发 universal 版。
      - name: Build automotiveApp release APK (universal)
        run: |
          cd src
          ./gradlew :automotiveApp:assembleRelease --no-daemon --no-configuration-cache --stacktrace
        env:
          ANDROID_SIGNING_STORE_FILE: /home/runner/lynxl.jks
          ANDROID_SIGNING_STORE_PASSWORD: android
          ANDROID_SIGNING_KEY_ALIAS: lynxl
          ANDROID_SIGNING_KEY_PASSWORD: android
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      # 9) 上传 universal APK 产物（通用包，车机直接装这个）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LynMusic-Car-XL2C-clock-release-universal
          path: src/automotiveApp/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error
