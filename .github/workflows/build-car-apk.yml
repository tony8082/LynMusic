name: Build LynMusic Car APK (Lyrics XL)

# 触发：推送到 car-lyrics-3x 分支，或手动 workflow_dispatch
on:
  push:
    branches: [ car-lyrics-3x ]
  workflow_dispatch:

jobs:
  build-car-apk:
    runs-on: ubuntu-latest
    steps:
      # 1) 检出本 fork 分支（内含 car-lyrics-3x.patch 文件）
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) 从上游拉取 v1.1.1 标签（fork 不自带 tag），切到该标签，
      #    再从本 fork 分支取回补丁并套用
      - name: Fetch v1.1.1 tag from upstream & apply lyrics patch
        run: |
          git remote add upstream https://github.com/wesley666/LynMusic.git
          git fetch upstream refs/tags/v1.1.1:refs/tags/v1.1.1 --depth=1
          git checkout v1.1.1
          git fetch origin car-lyrics-3x --depth=1
          git checkout origin/car-lyrics-3x -- car-lyrics-3x.patch
          git apply car-lyrics-3x.patch

      # 3) JDK 21（AGP / Kotlin 需要）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4) Android SDK 命令行工具
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5) 接受许可并安装 compileSdk=36 平台 + NDK
      - name: Accept licenses & install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platform-tools" "ndk;28.2.13676358" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 6) 构建车机 Release APK
      - name: Build automotiveApp release APK
        run: ./gradlew :automotiveApp:assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      # 7) 上传 APK 产物
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LynMusic-Car-XL-release
          path: automotiveApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
