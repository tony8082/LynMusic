name: Build LynMusic Car XL (Lyrics 2.5x)

on:
  push:
    branches: [ main ]
    paths:
      - 'apply_lyrics_xl.py'
      - 'automotiveApp/**'
      - '.github/workflows/build-car-xl.yml'
  workflow_dispatch:

jobs:
  build-automotive-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 Python 脚本应用歌词放大修改（比 git patch 更稳健）
      - name: Apply lyrics XL modifications
        run: python3 apply_lyrics_xl.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "ndk;28.2.13676358" --sdk_root=$ANDROID_SDK_ROOT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Gradle
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536M
          org.gradle.workers.max=2
          android.lintOnAssemble=false
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Automotive Debug APK
        run: |
          set +e
          ./gradlew :automotiveApp:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "========== BUILD FAILED - LAST 80 LINES =========="
            tail -80 build.log
            echo "=================================================="
          fi
          exit $EXIT_CODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LynMusic-Car-XL-debug-arm64
          path: automotiveApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
